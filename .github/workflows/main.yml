# =============================================================================
# WORKFLOW DE INTEGRACIÓN Y DESPLIEGUE CONTINUO (CI/CD)
# Proyecto: Sistema de Gestión de Pedidos y Guías de Despacho
# Infraestructura: AWS EC2, Amazon EFS (Temporal) y AWS S3
# =============================================================================

name: Deploy Sistema de Pedidos Cloud Native

# El pipeline se ejecutará automáticamente cada vez que se haga un 'push' o 'pull request'
# hacia la rama principal 'main'.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    # Se utiliza un entorno virtual de Ubuntu actualizado para compilar y construir
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------------------
      # PASO 1: Descargar el código del repositorio en la máquina virtual de GitHub
      # -------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -------------------------------------------------------------------------
      # PASO 2: Autenticarse en Docker Hub
      # Usa los secretos guardados en GitHub para iniciar sesión de forma segura
      # -------------------------------------------------------------------------
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------------------------
      # PASO 3: Construir la imagen de Docker usando el Dockerfile del proyecto
      # -------------------------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/app-pedidos:latest .

      # -------------------------------------------------------------------------
      # PASO 4: Subir (Push) la imagen recién creada a la cuenta de Docker Hub
      # -------------------------------------------------------------------------
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/app-pedidos:latest

      # -------------------------------------------------------------------------
      # PASO 5: Configurar credenciales temporales de AWS
      # -------------------------------------------------------------------------
      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      # -------------------------------------------------------------------------
      # PASO 5.5: Inyectar la Llave SSH Privada (.pem) en el runner de GitHub
      # -------------------------------------------------------------------------
      - name: Add SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # -------------------------------------------------------------------------
      # PASO 6: Conexión remota por SSH a la EC2 y Despliegue de la Aplicación
      # -------------------------------------------------------------------------
      - name: SSH commands to deploy
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST }} << 'EOF'
            
            # 1. Autenticar la máquina EC2 en DockerHub para poder descargar la imagen
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            
            # 2. Descargar (Pull) la versión más reciente de la imagen que subimos en el Paso 4
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/app-pedidos:latest
            
            # 3. Limpieza preventiva: Si hay un contenedor corriendo con el mismo nombre, lo detiene y elimina
            docker stop app-pedidos || true && docker rm app-pedidos || true
            
            # 4. Lanzamiento del Contenedor (Docker Run)
            #    -p 8080:8080                      -> Expone el puerto de la API REST.
            #    -e APP_AWS_ACCESS_KEY_ID          -> Inyecta la credencial de acceso AWS.
            #    -e APP_AWS_SECRET_ACCESS_KEY      -> Inyecta la credencial secreta AWS.
            #    -e APP_AWS_SESSION_TOKEN          -> Inyecta el token de sesión dinámico educativo.
            #    -e APP_EFS_PATH=/app/efs          -> Configura la ruta de trabajo interna para las guías temporales.
            #    -v /mnt/efs:/app/efs              -> Vincula la carpeta local del Amazon EFS 
            #                                         montado en la EC2 con el almacenamiento interno del contenedor.
            docker run -d --name app-pedidos \
              -p 8080:8080 \
              -e APP_AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e APP_AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e APP_AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}" \
              -e APP_EFS_PATH="/app/efs" \
              -v /mnt/efs:/app/efs \
              ${{ secrets.DOCKERHUB_USERNAME }}/app-pedidos:latest
          EOF
