# =============================================================================
# WORKFLOW DE INTEGRACIÓN Y DESPLIEGUE CONTINUO (CI/CD)
# Proyecto: Sistema de Gestión de Pedidos y Guías de Despacho
# Infraestructura: AWS EC2, Amazon EFS (Temporal) y AWS S3
# =============================================================================

name: Deploy Sistema de Pedidos Cloud Native

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------------------
      # PASO 1: Descargar el código del repositorio en la máquina virtual de GitHub
      # -------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -------------------------------------------------------------------------
      # PASO 2: Configurar el entorno de ejecución con Java 21
      # -------------------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # -------------------------------------------------------------------------
      # PASO 3: Compilar y construir el archivo JAR con Maven
      # Omitimos los test unitarios con -DskipTests para acelerar el pipeline
      # -------------------------------------------------------------------------
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # -------------------------------------------------------------------------
      # PASO 4: Autenticarse en Docker Hub
      # -------------------------------------------------------------------------
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------------------------
      # PASO 5: Construir la imagen de Docker usando el Dockerfile del proyecto
      # -------------------------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/app-pedidos:latest .

      # -------------------------------------------------------------------------
      # PASO 6: Subir (Push) la imagen recién creada a la cuenta de Docker Hub
      # -------------------------------------------------------------------------
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/app-pedidos:latest

      # -------------------------------------------------------------------------
      # PASO 7: Configurar credenciales temporales de AWS
      # -------------------------------------------------------------------------
      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      # -------------------------------------------------------------------------
      # PASO 7.5: Inyectar la Llave SSH Privada (.pem) en el runner de GitHub
      # -------------------------------------------------------------------------
      - name: Add SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # -------------------------------------------------------------------------
      # PASO 8: Conexión remota por SSH a la EC2 y Despliegue de la Aplicación
      # -------------------------------------------------------------------------
      - name: SSH commands to deploy
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST }} << 'EOF'
            
            # 1. Autenticar la máquina EC2 en DockerHub
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            
            # 2. Descargar (Pull) la versión más reciente de la imagen
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/app-pedidos:latest
            
            # 3. Limpieza preventiva de contenedores anteriores
            docker stop app-pedidos || true && docker rm app-pedidos || true
            
            # 4. Lanzamiento del Contenedor con amarre al volumen EFS
            #    -p 8080:8080                      -> Expone el puerto de la API REST.
            #    -e APP_AWS_ACCESS_KEY_ID          -> Inyecta la credencial de acceso AWS.
            #    -e APP_AWS_SECRET_ACCESS_KEY      -> Inyecta la credencial secreta AWS.
            #    -e APP_AWS_SESSION_TOKEN          -> Inyecta el token de sesión dinámico educativo.
            #    -e APP_EFS_PATH=/app/efs          -> Configura la ruta de trabajo interna para las guías temporales.
            #    -v /mnt/efs:/app/efs              -> Vincula la carpeta local del Amazon EFS 
            #                                         montado en la EC2 con el almacenamiento interno del contenedor.

            docker run -d --name app-pedidos \
              -p 8080:8080 \
              -e APP_AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e APP_AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e APP_AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}" \
              -e APP_EFS_PATH="/app/efs" \
              -v /mnt/efs:/app/efs \
              ${{ secrets.DOCKERHUB_USERNAME }}/app-pedidos:latest
          EOF
